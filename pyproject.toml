[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "valid-ot"
version = "0.1.0"
description = "Finite-intervention audit framework for local scores from spatial optimal-transport alignments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.3",
  "scipy==1.12.0",
  "scikit-learn==1.7.2",
  "statsmodels==0.14.4",
  "POT==0.9.5",
  "matplotlib==3.9.2",
  "seaborn==0.13.2",
  "anndata==0.10.8",
  "h5py==3.11.0",
  "psutil==6.1.0",
]

[project.optional-dependencies]
test = ["pytest==8.3.3"]
prepare = ["rdata"]

[tool.setuptools]
package-dir = {"" = "code"}

[tool.setuptools.packages.find]
where = ["code"]
